<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>요소 크기</title>
    <style>
      /* 요소 선택자(Element Selector) */
      html {
        font-size: 16px;
      }

      /* 클래스 선택자 */
      .em {
        color: purple;
      }
      .rem {
        color: green;
      }

      /* 복합 선택자(Combination Selector)
         공백 없이 붙여서 사용하며, 두 조건을 모두 만족하는 요소를 선택합니다.
      */
      span.em {
        font-size: 2em;
      }
      span.rem {
        font-size: 2rem;
      }
    </style>
  </head>
  <body>
    기본 사이즈
    <span class="em">
      <span class="em">중첩1<span class="em">중첩2</span></span>
    </span>
    <br />
    기본 사이즈
    <span class="rem">
      <span class="rem">중첩1<span class="rem">중첩2</span></span>
    </span>
  </body>
</html>
