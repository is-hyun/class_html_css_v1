<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 1. h1 ~ h6 -->
    <h1>큰 제목</h1>
    <h2>중간 제목</h2>
    <h3>중간 제목</h3>
    <h6>작은 제목</h6>

    <!-- 2. p 문단 -->
    <p>이건은 하나의 문단. 텍스트를 묶어 표시합니다</p>

    <!-- 3. a : 링크 생성. href 속성으로 목적지 지정 -->
    <a href="https://www.daum.net">여기를 클릭</a>

    <!-- 4. div : 콘텐츠를 각 구획으로 나누는 블록 태그 -->
    <div>
      <p>이 문단은 div 태그 안에 있습니다</p>
      <p>div 태그는 레이아웃을 나눌 때 유용합니다</p>
      <!-- 5. img 태그 -->
      <img src="https://picsum/photos/id/7/100/100" alt="" />
    </div>

    <!-- 6. ul + li : 순서 없는 목록 -->
    <ul>
      <li>항목 1</li>
      <li>항목 2</li>
      <li>항목 3</li>
    </ul>

    <!-- 7. ol + li : 순서 있는 목록 -->
    <ol>
      <li>항목 1</li>
      <li>항목 2</li>
      <li>항목 3</li>
    </ol>

    <!-- 8. button -->
    <button>나를 눌러보세요</button>
  </body>
</html>
