<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 자손 선택자 : h1의 자손인 p 태그를 선택 */
      h1 p {
        color: green;
      }
      /* 인접 형제 선택자 */
      h1 + p {
        color: red;
      }
      /* 일반 형제 선택자 : 본인(h1) 다음으로 오는 형제 태그 선택 */
      h1 ~ p {
        color: blue;
      }
    </style>
  </head>
  <body>
    <p>가나다라마바사</p>
    <h1>여기는 h1 태그야</h1>
    <p>가나다라마바사</p>
    <p>가나다라마바사</p>
    <p>가나다라마바사</p>
    <div>
      <p>123456</p>
    </div>
  </body>
</html>
