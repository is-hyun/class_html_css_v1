<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시멘틱 태그</title>
  </head>
  <body>
    <!-- header : 페이지 상단, 로고나 제목 포함 -->
    <header>
      <h1>나의 블로그</h1>
      <p>환영합니다! 다양한 주제를 다룹니다</p>
    </header>

    <!-- nav : 네비게이션 -->
    <nav>
      <ul>
        <li><a href="#">홈</a></li>
        <li><a href="#">소개</a></li>
        <li><a href="#">연락</a></li>
      </ul>
    </nav>

    <!-- section : 주제별 콘텐츠 구분 -->
    <section>
      <h2>오늘의 포스트</h2>
      <!-- article : 독립적인 콘텐츠 표현 -->
      <article>
        <h3>HTML5란</h3>
        <p>HTML5는 웹 표준으로 시멘틱 태그를 통해 구조를 명확히 합니다</p>
      </article>
    </section>

    <!-- aside : 부가적인 콘텐츠 / 사이드바 표현 -->
    <aside>
      <h3>추천링크</h3>
      <p><a href="https://www.naver.com">HTML 배우기</a></p>
    </aside>

    <!-- footer : 페이지 하단, 저작권 등 표시 -->
    <footer>
      <p>&copy; 2026 나의 블로그 All rights reserved.</p>
      <p>문의 : 010-1234-5678</p>
    </footer>
  </body>
</html>
