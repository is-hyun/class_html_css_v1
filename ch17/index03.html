<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        border: 2px solid #3c825b;
        padding: 10px;
        margin-bottom: 10px;

        display: flex;
        justify-content: space-between;
      }
      .item {
        display: flex;
        width: 100px;
        height: 100px;
        background-color: #ffd701;
        margin: 5px;
        border-radius: 10px;
        border: 2px solid #4585a2;
        color: white;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>
  </body>
</html>
