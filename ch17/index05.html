<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        width: 100vw;
        height: 100vh;
        margin: 0 auto;

        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        height: 100%;
        width: 100%;

        display: flex;
        justify-content: center;
        align-items: center;
      }
      .item {
        width: 300px;
        height: 300px;
        border: 2px solid #afafaf;
        background-color: #01ffff;
        border-radius: 15%;

        display: flex;
        justify-content: center;
        align-items: center;
      }
      .item-child {
        width: 150px;
        height: 150px;
        background-color: #ffe5c5;
        border-radius: 15%;
        color: #8f3a33;
        font-weight: bold;

        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">
        <div class="item-child">item chlid</div>
      </div>
    </div>
  </body>
</html>
