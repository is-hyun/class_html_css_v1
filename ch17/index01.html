<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        border: 2px solid #3c825b;
        padding: 10px;
        /* 규칙 1. 부모 상자가 flexbox 이어야 함 */
        display: flex;
        /* 주축 방향 설정 */
        flex-direction: row;
      }
      .item {
        width: 100px;
        height: 100px;
        background-color: #ff6247;
        margin: 5px;
        text-align: center;
        border-radius: 10px;
        border: 2px solid #527ea4;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>
  </body>
</html>
