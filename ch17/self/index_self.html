<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="phone">
      <div class="camera"></div>
      <div class="screen">
        <h1>배달의 민족</h1>
        <div class="search"></div>
        <input type="text" value="먹고 싶은 메뉴나 가게를 찾아보세요" />

        <main class="main-page">
          <ul class="option">
            <li>음식배달</li>
            <li>픽업</li>
            <li>장보기·쇼핑</li>
            <li>선물하기</li>
            <li>혜택모아보기</li>
          </ul>
          <div class="menu-list">
            <div class="menu">
              <button class="menu-icon">🍱</button>
              <span class="menu-name">족발·보쌈</span>
            </div>
            <div class="menu">
              <button class="menu-icon">🍣</button>
              <span class="menu-name">돈까스·회</span>
            </div>
            <div class="menu">
              <button class="menu-icon">🍕</button>
              <span class="menu-name">피자</span>
            </div>
            <div class="menu">
              <button class="menu-icon">🍲</button>
              <span class="menu-name">찜·탕</span>
            </div>
            <div class="menu">
              <button class="menu-icon">🍜</button>
              <span class="menu-name">중식</span>
            </div>
            <div class="menu">
              <button class="menu-icon">🎟️</button>
              <span class="menu-name">할인</span>
            </div>
            <div class="menu">
              <button class="menu-icon">🍽️</button>
              <span class="menu-name">맛집</span>
            </div>
            <div class="menu">
              <button class="menu-icon">🥣</button>
              <span class="menu-name">한그릇</span>
            </div>
            <div class="menu">
              <button class="menu-icon">🥡</button>
              <span class="menu-name">픽업</span>
            </div>
            <div class="menu">
              <button class="menu-icon">🍗</button>
              <span class="menu-name">브랜드관</span>
            </div>
          </div>

          <div class="bar">
            <button class="bar-option">홈</button>
            <button class="bar-option">장보기·쇼핑</button>
            <button class="bar-option">찜</button>
            <button class="bar-option">주문내역</button>
            <button class="bar-option">마이배민</button>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
