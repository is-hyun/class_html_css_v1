<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        width: 100vw;
        height: 100vh;

        display: flex;
        justify-content: center;
        /* align-items: baseline; */
      }
      .phone {
        width: 360px;
        height: 780px;
        border: 5px solid #333;
        border-radius: 20px;
        background-color: whitesmoke;
        padding: 5px;

        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .camera {
        width: 10px;
        height: 10px;
        border: 3px solid #333;
        background-color: black;
        border-radius: 50%;
      }
      .screen {
        width: 100%;
        height: 100%;
        background-color: antiquewhite;
        border-radius: 15px;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="camera"></div>
      <div class="screen">
        <div class="menu-list">
          <div class="menu-item">치킨</div>
          <div class="menu-item">피자</div>
          <div class="menu-item">한식</div>
          <div class="menu-item">분식</div>
          <div class="menu-item">카페/디저트</div>
        </div>
      </div>
    </div>
  </body>
</html>
