<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        width: 100vw;
        height: 100vh;

        display: flex;
        justify-content: center;
        /* align-items: baseline; */
      }
      .phone {
        width: 360px;
        height: 780px;
        border: 5px solid #333;
        border-radius: 20px;
        background-color: whitesmoke;
        padding: 5px;

        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .camera {
        width: 10px;
        height: 10px;
        border: 3px solid #333;
        background-color: black;
        border-radius: 50%;
      }
      .screen {
        width: 100%;
        height: 100%;
        background-color: slateblue;
        border-radius: 15px;

        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        margin-top: 5px;
        margin-bottom: 10px;
        color: cadetblue;
      }
      input {
        width: 90%;
        height: 30px;
        border: 1px solid #707070;
        border-radius: 20px;
        margin: 5px;
      }

      .main-page {
        width: 100%;
        height: 80%;
        margin-top: 20%;
        padding: 10px 15px;
        box-sizing: border-box;

        background-color: white;
        border-radius: 15px;
      }
      ul {
        padding: 0;
        margin: 0;
        list-style: none;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        width: 100%;
      }
      .menu-list {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        width: 100%;
      }
      .menu-item {
        width: 50px;
        height: 50px;
        border-radius: 20%;
        background-color: #eee;
        margin-top: 20px;
        font-size: 13px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="camera"></div>
      <div class="screen">
        <h1>배달의 민족</h1>
        <input type="text" />

        <div class="main-page">
          <ul class="option">
            <li>음식배달</li>
            <li>픽업</li>
            <li>장보기·쇼핑</li>
            <li>선물하기</li>
            <li>혜택모아보기</li>
          </ul>
          <div class="menu-list">
            <div class="menu-item">치킨</div>
            <div class="menu-item">피자</div>
            <div class="menu-item">한식</div>
            <div class="menu-item">분식</div>
            <div class="menu-item">카페</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
