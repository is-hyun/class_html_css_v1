<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #title {
        color: darkblue;
        text-align: center;
      }

      p {
        color: #666;
      }

      h2 {
        color: rgb(31, 31, 31);
      }

      h3 {
        color: rgb(209, 0, 0);
      }

      .check {
        color: green;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Tenco 학습 리소스</h1>
    <p>HTML과 CSS를 배우기 위한 추천 리소스를 확인하세요!</p>
    <h2>추천 자료</h2>
    <h3>이 자료는 초보자에게 특히 추천됩니다!</h3>
    <ul>
      <li class="check">HTML 기초 튜토리얼</li>
      <li class="check">CSS 선택자 가이드</li>
      <li>웹 디자인 입문</li>
    </ul>
    <p>더 많은 자료를 보려면 아래 링크를 클릭하세요:</p>
    <p><a href="#">학습 사이트 방문</a></p>
  </body>
</html>
